name: Submit to F-Droid

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Prepare the fork and the commit but do not push or open the merge request'
        type: boolean
        default: true

env:
  GITLAB_API: https://gitlab.com/api/v4
  UPSTREAM_PATH: fdroid/fdroiddata
  GITLAB_USER: alxia0

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream project
        id: upstream
        run: |
          UPSTREAM_ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['UPSTREAM_PATH'], safe=''))")
          INFO=$(curl -fsS "$GITLAB_API/projects/$UPSTREAM_ENC")
          echo "id=$(echo "$INFO" | jq -r .id)" >> "$GITHUB_OUTPUT"
          echo "default_branch=$(echo "$INFO" | jq -r .default_branch)" >> "$GITHUB_OUTPUT"

      - name: Fork fdroiddata (or reuse existing fork)
        id: fork
        env:
          TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
        run: |
          FORK_ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$GITLAB_USER/fdroiddata', safe=''))")
          EXISTING=$(curl -fsS -H "PRIVATE-TOKEN: $TOKEN" "$GITLAB_API/projects/$FORK_ENC" || true)
          if [ -n "$EXISTING" ] && echo "$EXISTING" | jq -e .id >/dev/null 2>&1; then
            echo "Fork already exists."
            echo "id=$(echo "$EXISTING" | jq -r .id)" >> "$GITHUB_OUTPUT"
          else
            CREATED=$(curl -fsS -X POST -H "PRIVATE-TOKEN: $TOKEN" \
              "$GITLAB_API/projects/${{ steps.upstream.outputs.id }}/fork")
            echo "id=$(echo "$CREATED" | jq -r .id)" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for fork import to finish
        env:
          TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -fsS -H "PRIVATE-TOKEN: $TOKEN" \
              "$GITLAB_API/projects/${{ steps.fork.outputs.id }}" | jq -r .import_status)
            echo "import_status: $STATUS"
            if [ "$STATUS" = "finished" ] || [ "$STATUS" = "none" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Fork import did not finish in time" >&2
          exit 1

      - name: Clone fork and add metadata
        env:
          TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
        run: |
          git clone "https://oauth2:${TOKEN}@gitlab.com/$GITLAB_USER/fdroiddata.git" fork
          cd fork
          git remote add upstream "https://gitlab.com/$UPSTREAM_PATH.git"
          git fetch upstream "${{ steps.upstream.outputs.default_branch }}"
          git checkout -B add-com-rowtine-app "upstream/${{ steps.upstream.outputs.default_branch }}"
          git config user.name "$GITLAB_USER"
          git config user.email "$GITLAB_USER@users.noreply.gitlab.com"

          cat > metadata/com.rowtine.app.yml <<'YAML'
          Categories:
            - Habit Tracker
            - Inventory
            - Time Tracker
          License: Apache-2.0
          AuthorName: alxia0
          WebSite: https://github.com/alxia0/rowtine
          SourceCode: https://github.com/alxia0/rowtine
          IssueTracker: https://github.com/alxia0/rowtine/issues
          Changelog: https://github.com/alxia0/rowtine/blob/main/CHANGELOG.md

          RepoType: git
          Repo: https://github.com/alxia0/rowtine.git

          Builds:
            - versionName: '1.1'
              versionCode: 2
              commit: v1.1.0
              subdir: android
              sudo:
                - curl -Lo node.tar.gz https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.gz
                - echo "6e1db87ef58b8819e5d5402eff1536491b18edd8eb7bee5ef7897876e88dc5ff node.tar.gz"
                  | sha256sum -c -
                - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
                - corepack enable
              prebuild:
                - cd ..
                - yarn install --immutable
                - yarn build
                - yarn cap sync android
              gradle:
                - yes
              output: app/build/outputs/apk/release/app-release.apk
              scandelete:
                - node_modules
                - .yarn
              scanignore:
                - src/content/guide.zip
                - tests/e2e/fixtures/mini-patron.zip
                - tests/e2e/fixtures/captures/grand-diagramme-es.zip
                - tests/e2e/fixtures/captures/granny-carre.zip
                - tests/e2e/fixtures/captures/grand-diagramme-fr.zip
                - tests/e2e/fixtures/captures/grand-diagramme-de.zip
                - tests/e2e/fixtures/captures/grand-diagramme-en.zip

          AutoUpdateMode: None
          UpdateCheckMode: Tags
          CurrentVersion: '1.1'
          CurrentVersionCode: 2
          YAML

          git add metadata/com.rowtine.app.yml
          git commit -m "New app: Rowtine"
          git diff upstream/${{ steps.upstream.outputs.default_branch }} --stat

      - name: Push branch
        if: ${{ !inputs.dry_run }}
        working-directory: fork
        run: git push origin add-com-rowtine-app --force-with-lease

      - name: Open merge request
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
        run: |
          curl -fsS -X POST -H "PRIVATE-TOKEN: $TOKEN" \
            --data-urlencode "source_branch=add-com-rowtine-app" \
            --data-urlencode "target_branch=${{ steps.upstream.outputs.default_branch }}" \
            --data-urlencode "target_project_id=${{ steps.upstream.outputs.id }}" \
            --data-urlencode "title=New app: Rowtine" \
            --data-urlencode "description=Adds com.rowtine.app (Rowtine), a knitting/crochet companion.

          - License: Apache-2.0
          - Source: https://github.com/alxia0/rowtine
          - Build recipe tested end to end with \`fdroid build --server\` on the official buildserver image (SDK/NDK/Gradle Debian)." \
            "$GITLAB_API/projects/${{ steps.fork.outputs.id }}/merge_requests"

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run: fork prepared and commit created locally, nothing pushed. Re-run with dry_run=false to push and open the MR."
