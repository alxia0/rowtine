name: Submit to F-Droid

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Prepare the fork and the commit but do not push or update the merge request'
        type: boolean
        default: true
      tag:
        description: 'Release tag to submit (e.g. v1.3.4); version, versionCode and commit are read from it'
        required: true
        type: string

env:
  GITLAB_API: https://gitlab.com/api/v4
  UPSTREAM_PATH: fdroid/fdroiddata
  GITLAB_USER: alxia0

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          path: app

      - name: Read version from the tag
        id: version
        working-directory: app
        run: |
          NAME=$(jq -r .version package.json)
          CODE=$(jq -r .buildNumber package.json)
          if [ "v$NAME" != "${{ inputs.tag }}" ]; then
            echo "Tag ${{ inputs.tag }} does not match package.json version $NAME" >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream project
        id: upstream
        run: |
          UPSTREAM_ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['UPSTREAM_PATH'], safe=''))")
          INFO=$(curl -fsS "$GITLAB_API/projects/$UPSTREAM_ENC")
          echo "id=$(echo "$INFO" | jq -r .id)" >> "$GITHUB_OUTPUT"
          echo "default_branch=$(echo "$INFO" | jq -r .default_branch)" >> "$GITHUB_OUTPUT"

      - name: Check that the fork exists
        id: fork
        env:
          TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
        run: |
          FORK_ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$GITLAB_USER/fdroiddata', safe=''))")
          EXISTING=$(curl -sS -H "PRIVATE-TOKEN: $TOKEN" -w '\n%{http_code}' "$GITLAB_API/projects/$FORK_ENC")
          EXISTING_CODE=$(echo "$EXISTING" | tail -n1)
          EXISTING_BODY=$(echo "$EXISTING" | sed '$d')
          if [ "$EXISTING_CODE" != "200" ]; then
            echo "No fork found at gitlab.com/$GITLAB_USER/fdroiddata (HTTP $EXISTING_CODE)." >&2
            echo "Fork https://gitlab.com/fdroid/fdroiddata manually first (Fork button in the GitLab UI), then re-run this workflow." >&2
            exit 1
          fi
          echo "id=$(echo "$EXISTING_BODY" | jq -r .id)" >> "$GITHUB_OUTPUT"

      - name: Wait for fork import to finish
        env:
          TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -fsS -H "PRIVATE-TOKEN: $TOKEN" \
              "$GITLAB_API/projects/${{ steps.fork.outputs.id }}" | jq -r .import_status)
            echo "import_status: $STATUS"
            if [ "$STATUS" = "finished" ] || [ "$STATUS" = "none" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Fork import did not finish in time" >&2
          exit 1

      - name: Clone fork and add the Build entry
        env:
          TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          git clone "https://oauth2:${TOKEN}@gitlab.com/$GITLAB_USER/fdroiddata.git" fork
          cd fork
          git remote add upstream "https://gitlab.com/$UPSTREAM_PATH.git"
          git fetch upstream "${{ steps.upstream.outputs.default_branch }}"
          git checkout -B update-com-rowtine-app "upstream/${{ steps.upstream.outputs.default_branch }}"
          git config user.name "$GITLAB_USER"
          git config user.email "$GITLAB_USER@users.noreply.gitlab.com"

          # Copies the last Build entry with the new versionName, versionCode and commit,
          # and moves CurrentVersion/CurrentVersionCode: the rest of the file stays as upstream has it.
          python3 - <<'PY'
          import os, re, sys
          path = 'metadata/com.rowtine.app.yml'
          name, code, commit = os.environ['VERSION_NAME'], os.environ['VERSION_CODE'], os.environ['COMMIT']
          s = open(path).read()
          if re.search(rf'^  - versionName: {re.escape(name)}$', s, re.M):
              sys.exit(f'versionName {name} already has a Build entry')
          end = s.index('\n\nAllowedAPKSigningKeys:')
          last = s[s.rindex('\n  - versionName:', 0, end) + 1:end]
          new = re.sub(r'(?m)^(  - versionName: ).*$', rf'\g<1>{name}', last)
          new = re.sub(r'(?m)^(    versionCode: ).*$', rf'\g<1>{code}', new)
          new = re.sub(r'(?m)^(    commit: ).*$', rf'\g<1>{commit}', new)
          s = s[:end] + '\n\n' + new + s[end:]
          s = re.sub(r'(?m)^CurrentVersion: .*$', f'CurrentVersion: {name}', s)
          s = re.sub(r'(?m)^CurrentVersionCode: .*$', f'CurrentVersionCode: {code}', s)
          open(path, 'w').write(s)
          PY

          git add metadata/com.rowtine.app.yml
          git commit -m "Update Rowtine to $VERSION_NAME ($VERSION_CODE)"
          git diff "upstream/${{ steps.upstream.outputs.default_branch }}"

      - name: Push branch
        if: ${{ !inputs.dry_run }}
        working-directory: fork
        run: git push origin update-com-rowtine-app --force-with-lease

      - name: Open or find merge request
        id: mr
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
        run: |
          TITLE="Update Rowtine to ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"
          DESCRIPTION="Adds the ${{ steps.version.outputs.name }} Build entry for com.rowtine.app (tag ${{ inputs.tag }}, commit ${{ steps.version.outputs.commit }})."

          EXISTING_MRS=$(curl -fsS -H "PRIVATE-TOKEN: $TOKEN" \
            "$GITLAB_API/projects/${{ steps.upstream.outputs.id }}/merge_requests?source_branch=update-com-rowtine-app&source_project_id=${{ steps.fork.outputs.id }}&state=opened")
          if [ "$(echo "$EXISTING_MRS" | jq 'length')" -gt 0 ]; then
            IID=$(echo "$EXISTING_MRS" | jq -r '.[0].iid')
            echo "MR already open: $(echo "$EXISTING_MRS" | jq -r '.[0].web_url')"
          else
            CREATED=$(curl -fsS -X POST -H "PRIVATE-TOKEN: $TOKEN" \
              --data-urlencode "source_branch=update-com-rowtine-app" \
              --data-urlencode "target_branch=${{ steps.upstream.outputs.default_branch }}" \
              --data-urlencode "target_project_id=${{ steps.upstream.outputs.id }}" \
              --data-urlencode "title=$TITLE" \
              --data-urlencode "description=$DESCRIPTION" \
              "$GITLAB_API/projects/${{ steps.fork.outputs.id }}/merge_requests")
            IID=$(echo "$CREATED" | jq -r '.iid')
            echo "MR created: $(echo "$CREATED" | jq -r '.web_url')"
          fi
          echo "iid=$IID" >> "$GITHUB_OUTPUT"

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run: fork prepared and commit created locally, nothing pushed. Re-run with dry_run=false to push and update the MR."
