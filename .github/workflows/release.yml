name: Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach the APK to (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      # Secrets are not allowed in a step-level `if:`; expose their presence here.
      HAS_PLAY_SA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build web app
        run: yarn build

      - name: Sync Capacitor Android
        run: yarn cap sync android

      - name: Write release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rowtine-release.jks"
          cat > android/keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/rowtine-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build signed release AAB (Google Play)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload AAB to Google Play (alpha)
        if: env.HAS_PLAY_SA == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rowtine.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: alpha
          status: completed

      - name: Attach APK and AAB to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          mv "$APK" "rowtine-$TAG.apk"
          mv "$AAB" "rowtine-$TAG.aab"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Rowtine ${TAG#v}" --generate-notes
          gh release upload "$TAG" "rowtine-$TAG.apk" "rowtine-$TAG.aab" --clobber
